# Example Machinist scene.
#
# Run with:
#   uv run machinist run examples/scene.yaml --no-tui
# or with the TUI:
#   uv run machinist run examples/scene.yaml

devices:
  - name: db1
    kind: dobot_dashboard         # default port 29999
  - name: arm1
    kind: robot                   # generic arm: pick a protocol + transport
    options:
      protocol: srci              # SRCI command/status telegrams
      transport: tcp              # any of: tcp, udp (profinet-style framing)
      joint_count: 6
      # Drive real FK/IK either with a kinematics block, e.g.:
      #   kinematics: {backend: dh, dh_params: [[0, 0.1, 0, 1.57], ...]}
      # or directly at the top level: {dh_params: ...} / {urdf: examples/cr20a.urdf}
      opcua: {port: 4840}         # also publish live state over OPC-UA
  - name: io1
    kind: weidmuller_ur20      # default port 502 -> moves to 127.0.0.2
    options:
      inputs: 16
      outputs: 16
  - name: gripper1
    kind: pneumatic_gripper    # IO-only, no listener
    options:
      settle_seconds: 0.5
  - name: mill
    kind: haas_ngc             # MDC on TCP/5051
    options:
      doors: [main, sub]
      mtconnect_port: 5052     # GET /probe and /current (cycle/spindle/tool/xyz)
      opcua: {port: 4841}      # cycle/spindle/tool/parts/xyz over OPC-UA
  - name: smooth
    kind: mazak_smoothx
    options:
      interfaces: [io]           # keeps the example self-contained
      mtconnect_port: 5053
      # Mazak SmoothX acts as the EtherNet/IP Scanner/Master.
      # It does NOT listen on 44818/2222; instead it opens an outbound Class 1
      # connection to the robot Adapter/Slave you name below.
      #
      # For EtherNet/IP only:
      # interfaces: [ethernetip]
      # ethernetip:
      #   host: 192.168.90.20     # remote robot adapter address
      #   port: 44818
      #   originator_udp_port: 2222
      #   target_udp_port: 2222
      #
      # To keep native machinist IO and EtherNet/IP active at the same time:
      # interfaces: [io, ethernetip]
      # ethernetip:
      #   host: 192.168.90.20
   #- name: lathe
   #  kind: mazak_840d           # S7 stub on TCP/102
   #  options:
   #    mappings:
  #      door_open_cmd:  {db: 1, byte: 0, bit: 0}
  #      door_close_cmd: {db: 1, byte: 0, bit: 1}

io_links:
  # Wire the IO controller's output 5 to the pneumatic gripper.
  - {source: io1.o5, target: gripper1.cmd_open}
  - {source: io1.o6, target: gripper1.cmd_close}
  # Wire the IO controller's output 1 to the Mazak's door open command.
  #- {source: io1.o1, target: lathe.door_open_cmd}
