# Mazak SmoothX robot-interface examples.
#
# Run with:
#   uv run machinist run examples/mazak_smoothx.yaml --no-tui
#
# `mazak_smooth` supports both EtherNet/IP roles.
# The default is adapter mode, which listens for inbound TCP/44818 + UDP/2222
# traffic from a scanner/client. Scanner mode stays available when you want the
# emulator to initiate the Class 1 connection itself.

devices:
  - name: smooth_io_only
    kind: mazak_smoothx
    options:
      interfaces: [io]
      mtconnect_port: 5053

  - name: smooth_eip_adapter
    kind: mazak_smoothx
    options:
      interfaces: [ethernetip]
      ethernetip:
        mode: adapter
        udp_port: 2222
      mtconnect_port: 5054

  - name: smooth_eip_scanner
    kind: mazak_smoothx
    options:
      interfaces: [ethernetip]
      ethernetip:
        mode: scanner
        host: 192.168.90.21
        port: 44818
        originator_udp_port: 2222
        target_udp_port: 2222
        output_assembly_instance_id: 100
        input_assembly_instance_id: 101
        requested_packet_rate_ms: 20
      mtconnect_port: 5055

  # SmoothAi tuned to the mazak6.pcap capture: asymmetric door travel, no front
  # door, and the side-door DI/DO bit positions of the SmoothAi control word.
  - name: smooth_ai_real_timings
    kind: mazak_smooth
    options:
      variant: smoothai
      interfaces: [ethernetip]
      door_open_seconds: 5.4     # DI107 -> DO107, measured over 10 door cycles
      door_close_seconds: 4.3    # DI108 -> DO108
      front_door: false          # real machine never asserts DO110/DO111
      cycle_duration_seconds: 1500
      ethernetip:
        mode: adapter
        udp_port: 2222
      mtconnect_port: 5057

  - name: smooth_hybrid
    kind: mazak_smoothx
    options:
      interfaces: [io, ethernetip]
      ethernetip:
        mode: adapter
        udp_port: 2222
      mtconnect_port: 5056

io_links:
  # Native IO can still drive the SmoothX emulator when `io` is enabled.
  # Example:
  # - {source: io1.o1, target: smooth_hybrid.di107}   # door open command
  # - {source: io1.o2, target: smooth_hybrid.di108}   # door close command
